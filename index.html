<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lalehan - Menu</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Amiri:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

  <!-- CSV Parser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" defer></script>

  <style>
    :root{
      --accent:#7D3C1F;
      --bg:#ffffff;
      --muted:#6b6b6b;
      --card-shadow: 0 6px 18px rgba(0,0,0,0.06);
      --radius:12px;
      --max-width:1100px;
    }

    html,body{height:100%;}
    body{
      margin:0;
      font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial;
      background:var(--bg);
      color:#111;
      padding:20px;
      display:flex;
      justify-content:center;
    }

    .arabic{font-family:'Amiri', Inter, serif;direction:rtl;text-align:right}
    .wrap{width:100%;max-width:var(--max-width)}

    header{display:flex;justify-content:space-between;align-items:center;padding:18px;border-radius:14px;box-shadow:var(--card-shadow);margin-bottom:18px}

    .lang-toggle{display:flex;gap:6px;border:1px solid #eee;padding:6px;border-radius:999px}
    .lang-toggle button{border:0;background:none;padding:6px 12px;font-weight:600;cursor:pointer;border-radius:999px}
    .lang-toggle button.active{background:var(--accent);color:#fff}

    h2.section-title{margin:16px 0 8px}

    /* NORMAL ITEMS */
    .category-section{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
    .card{background:#fff;border-radius:var(--radius);box-shadow:var(--card-shadow);overflow:hidden}
    .media{height:150px;background:#f3f3f3}
    .media img{width:100%;height:100%;object-fit:cover}
    .body{padding:12px}
    .title-row{display:flex;justify-content:space-between;gap:8px}
    .item-title{font-weight:700}
    .item-desc{font-size:13px;color:var(--muted);margin-top:6px}
    .price{font-weight:800;color:var(--accent)}

    /* COMBOS */
    .combo-card{background:#fff;border-radius:var(--radius);box-shadow:var(--card-shadow);padding:18px;margin-bottom:14px}
    .combo-header{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
    .combo-title{font-weight:700;font-size:18px}
    .combo-desc{margin:10px 0;color:var(--muted);font-size:14px}
    .combo-meta{font-size:14px;margin-bottom:10px;display:flex;gap:14px;flex-wrap:wrap}
    details{border-top:1px dashed #ddd;padding-top:10px}
    summary{cursor:pointer;color:var(--accent);font-weight:600}
    .choice-group{margin-top:8px;font-size:14px}
    .addons{margin-top:10px;font-size:14px}
    .addon{display:inline-block;border:1px solid #ddd;border-radius:999px;padding:4px 10px;margin:4px 6px 0 0}
  </style>
</head>
<body>
<div class="wrap">

<header>
  <strong id="brandName">لاليهان</strong>
  <div class="lang-toggle">
    <button id="btn-ar" class="active">ع</button>
    <button id="btn-en">EN</button>
  </div>
</header>

<main id="menuContent"></main>

</div>

<script>
const SHEET_CSV_URL = 'online_menu - Items.csv';
let lang = 'ar';
let data = [];

function parseCSV(text){
  return Papa.parse(text,{header:true,skipEmptyLines:true}).data;
}

function render(){
  const root = document.documentElement;
  const wrap = document.querySelector('.wrap');
  root.lang = lang;
  root.dir = lang === 'ar' ? 'rtl':'ltr';
  wrap.classList.toggle('arabic', lang==='ar');

  document.getElementById('brandName').textContent = lang==='ar'?'لاليهان':'Lalehan';

  const container = document.getElementById('menuContent');
  container.innerHTML='';

  /* COMBOS FIRST */
  const combos = data.filter(i=>i.category==='Combo');
  if(combos.length){
    const title = document.createElement('h2');
    title.className='section-title';
    title.textContent = lang==='ar'?'الوجبات المشتركة':'Combo Meals';
    container.appendChild(title);

    combos.forEach(c=>container.appendChild(renderCombo(c)));
  }

  /* OTHER CATEGORIES */
  const categories = [...new Set(data.filter(i=>i.category!=='Combo').map(i=>i.category))];

  categories.forEach(cat=>{
    const items = data.filter(i=>i.category===cat);
    if(!items.length) return;

    const h = document.createElement('h2');
    h.className='section-title';
    h.textContent = lang==='ar'?items[0].ar_category:cat;
    container.appendChild(h);

    const grid = document.createElement('div');
    grid.className='category-section';

    items.forEach(item=>grid.appendChild(renderItem(item)));
    container.appendChild(grid);
  });
}

function renderCombo(c){
  const div=document.createElement('div');
  div.className='combo-card';

  const name = lang==='ar'?c.ar_name:c.en_name;
  const desc = lang==='ar'?c.ar_desc:c.en_desc;
  const includes = lang==='ar'?c.ar_includes:c.en_includes;
  const serves = lang==='ar'?c.ar_serves:c.en_serves;
  const choices = lang==='ar'?c.ar_choices:c.en_choices;
  const addons = lang==='ar'?c.ar_addons:c.en_addons;

  div.innerHTML=`
    <div class="combo-header">
      <div class="combo-title">${name}</div>
      <div class="price">${c.price}</div>
    </div>
    <div class="combo-desc">${desc||''}</div>
    <div class="combo-meta">
      ${includes?`<div><strong>${lang==='ar'?'يشمل':'Includes'}:</strong> ${includes}</div>`:''}
      ${serves?`<div><strong>${lang==='ar'?'يكفي':'Serves'}:</strong> ${serves}</div>`:''}
    </div>
    <details>
      <summary>${lang==='ar'?'عرض الخيارات':'View choices'}</summary>
      ${renderChoices(choices)}
      ${addons?`<div class="addons"><strong>${lang==='ar'?'إضافات':'Add-ons'}:</strong><br>${renderAddons(addons)}</div>`:''}
    </details>`;
  return div;
}

function renderChoices(raw){
  if(!raw) return '';
  return raw.split('||').map(g=>{
    const [t,i]=g.split(':');
    return `<div class="choice-group"><strong>${t}</strong>${i||''}</div>`;
  }).join('');
}

function renderAddons(raw){
  return raw.split(';').map(a=>`<span class="addon">${a}</span>`).join('');
}

function renderItem(item){
  const card=document.createElement('div');
  card.className='card';

  const media=document.createElement('div');media.className='media';
  if(item.image_url){const img=document.createElement('img');img.src=item.image_url;media.appendChild(img)}

  const body=document.createElement('div');body.className='body';
  const titleRow=document.createElement('div');titleRow.className='title-row';

  const title=document.createElement('div');title.className='item-title';
  title.textContent=lang==='ar'?item.ar_name:item.en_name;

  const price=document.createElement('div');price.className='price';price.textContent=item.price||'';

  titleRow.appendChild(lang==='ar'?price:title);
  titleRow.appendChild(lang==='ar'?title:price);

  const desc=document.createElement('div');desc.className='item-desc';
  desc.textContent=lang==='ar'?item.ar_desc:item.en_desc;

  body.appendChild(titleRow);body.appendChild(desc);
  card.appendChild(media);card.appendChild(body);
  return card;
}

fetch(SHEET_CSV_URL).then(r=>r.text()).then(t=>{data=parseCSV(t);render()});

btn_ar.onclick=()=>{lang='ar';btn_ar.classList.add('active');btn_en.classList.remove('active');render()};
btn_en.onclick=()=>{lang='en';btn_en.classList.add('active');btn_ar.classList.remove('active');render()};
</script>
</body>
</html>
