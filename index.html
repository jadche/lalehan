<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lalehan - Menu</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Amiri:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" defer></script>

  <style>
    :root{
      --accent:#7D3C1F;
      --bg:#ffffff;
      --muted:#6b6b6b;
      --card-shadow: 0 6px 18px rgba(0,0,0,0.06);
      --radius:12px;
      --max-width:1100px;
    }

    html,body{height:100%;}
    body{
      margin:0;
      font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
      background:var(--bg);
      color:#111;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding:20px;
      display:flex;
      justify-content:center;
    }

    .wrap{width:100%;max-width:var(--max-width);}

    header{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:18px;border-radius:14px;box-shadow:var(--card-shadow);background:#fff;margin-bottom:18px;
    }

    .brand{
      display:flex;align-items:center;gap:14px;
    }
    .logo{width:58px;height:58px;border-radius:10px;background:linear-gradient(180deg,var(--accent),#5b2916);overflow:hidden;display:block;align-items:center;justify-content:center;color:white;font-weight:700;font-size:20px;}
    .brand h1{margin:0;font-size:20px}
    .brand p{margin:0;color:var(--muted);font-size:13px}

    .controls{display:flex;gap:12px;align-items:center}
    .lang-toggle{display:flex;align-items:center;background:#fff;border-radius:999px;padding:6px;border:1px solid #eee;box-shadow:0 2px 6px rgba(0,0,0,0.03)}
    .lang-toggle button{border:0;background:transparent;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:600}
    .lang-toggle button.active{background:var(--accent);color:white}

    main{display:block;}

    /* COMBOS SECTION STYLES */
    .combos-section {
      margin-bottom: 28px;
    }

    .combos-header {
      margin: 0 0 16px 0;
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }

    .combos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
      margin-bottom: 20px;
    }

    .combo-card {
      background: #fff;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      border-top: 4px solid var(--accent);
      transition: transform 0.2s ease;
    }

    .combo-header {
      padding: 16px;
      background: #fdfaf8;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .combo-name-group {
      display: flex;
      flex-direction: column;
    }

    .combo-name {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      color: var(--accent);
    }

    .combo-serves {
      font-size: 12px;
      color: var(--muted);
      margin: 2px 0 0 0;
    }

    .combo-base-price {
      font-size: 18px;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 4px;
      direction: ltr;
    }

    .combo-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .combo-description {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
      margin: 0;
      white-space: pre-wrap;
    }

    /* View Choices Toggle */
    .choices-toggle {
      background: none;
      border: 1px solid #eee;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
      margin-top: 4px;
    }

    .choices-toggle:hover {
      background: #fdfaf8;
    }

    .choices-content {
      display: none;
      padding: 12px;
      background: #f9f7f5;
      border-radius: 8px;
      margin-top: 8px;
      border: 1px dashed #ddd;
    }

    .choices-content.active {
      display: block;
    }

    .choice-group-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 0 8px 0;
      border-bottom: 1px solid #eee;
      padding-bottom: 4px;
    }

    .choice-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      padding: 4px 0;
    }

    .choice-price {
      font-weight: 600;
      color: var(--accent);
      direction: ltr;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .choice-price.included {
      color: #27ae60;
    }

    /* MENU SECTION STYLES */
    .menu-area{display:flex;flex-direction:column;gap:18px}
    .category-section{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}

    .card{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--card-shadow);display:flex;flex-direction:column}
    .card .media{height:160px;background:#f3f3f3;display:flex;align-items:center;justify-content:center}
    .card img{width:100%;height:100%;object-fit:cover}
    .card .body{padding:12px}

    .title-row{
      display:flex;
      justify-content:space-between;
      gap:8px;
      align-items:start;
    }

    .item-title{font-weight:700;margin:0;font-size:16px}
    .item-desc{margin:8px 0 0 0;color:var(--muted);font-size:13px}

    .price{
      font-weight:800;
      color:var(--accent);
      font-size:15px;
      direction: ltr;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    footer{margin-top:20px;padding:8px 0;color:var(--muted);font-size:13px;text-align:center}

    .arabic{font-family: 'Amiri', 'Inter', serif;direction:rtl;text-align:right}

    /* RTL Alignment Fixes */
    .arabic .title-row {
      flex-direction: row-reverse; /* Keep Price on Left, Title on Right in RTL */
    }

    .arabic .combo-header {
      flex-direction: row-reverse; /* Keep Price on Left, Name on Right in RTL */
    }

    .arabic .choice-item {
      flex-direction: row-reverse; /* Keep Price on Left, Label on Right in RTL */
    }

    .sar-icon {
      width: 14px;
      height: 14px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo">
          <img src="https://res.cloudinary.com/dwtnhj8yh/image/upload/v1768838154/Fub0z8r_-_Imgur_mp04em.jpg" alt="Lalehan Logo" style="width:100%;height:100%;object-fit:contain;display:block;">
        </div>
        <div>
          <h1 id="brandName">Lalehan</h1>
          <p id="brandTag">نكهات تُطهى بشغف</p>
        </div>
      </div>

      <div class="controls">
        <div class="lang-toggle" role="tablist" aria-label="Language Switch">
          <button id="btn-en">EN</button>
          <button id="btn-ar" class="active">ع</button>
        </div>
      </div>
    </header>

    <main>
      <section class="combos-section">
        <h2 class="combos-header" id="combosTitle">الوجبات المميزة</h2>
        <div id="combosContent" class="combos-grid"></div>
      </section>

      <section class="menu-area">
        <div id="menuContent"></div>
      </section>

      <!-- Contact Section -->
      <section id="contactSection" style="margin-top:30px;padding:16px;background:#fff;border-radius:12px;box-shadow:var(--card-shadow)">
        <p id="contactPhone">Phone: <a href="tel:+966567097574">056 709 7574</a></p>
        <p id="contactHours"></p>
        <p id="contactDirections"><a href="https://maps.app.goo.gl/SsmKjYCcSftRwVDd8" target="_blank">📍Our location</a></p>
        <p id="contactAddress"></p>
      </section>
    </main>

    <footer>
      <div id="footerText"></div>
    </footer>
  </div>

  <script>
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTpzs_8lITELomoxjkf_Pk2prXu26ZiF3Xyf1i3Ef68qgKTXAzeb1VdJyfcpzBIhNGux2apV7Rz2lTt/pub?output=csv";
  const BRAND = {nameEn: 'Lalehan', nameAr: 'لاليهان'};

  const combosData = [
    {
      id: 'combo_1',
      name: 'Lalehan Sofra',
      ar_name: 'سفرة لاليهان',
      price: 79,
      description: 'A warm table made for sharing\nChoose 2 mains, 2 sides, and 1 starter',
      ar_description: 'سفرة دافئة للمشاركة\nتحتوي على طبقين رئيسيين + طبقين جانبيين + واحد مقبلات',
      serves: '2-3 people',
      ar_serves: '2-3 أشخاص',
      premium_items: [
        { name: 'Kibbeh Labanieh', ar_name: 'كبة بلبن', price: 3 },
        { name: 'Lalehan Mix (Labanieh)', ar_name: 'لبنية لاليهان', price: 3 },
        { name: 'Creamy Lemon Chicken', ar_name: 'دجاج بكريمة الليمون', price: 3 },
        { name: 'Izmir Kofta', ar_name: 'كفتة إزمير', price: 5 }
      ],
      fatteh_items: [
        { name: 'Yaprak Dolma Fatteh', ar_name: 'فتة ورق عنب', price: 15 },
        { name: 'Eggplant Fatteh', ar_name: 'فتة باذنجان', price: 15 },
        { name: 'Chicken Fatteh', ar_name: 'فتة دجاج بالسماق (مسخن)', price: 18 },
        { name: 'Pasha Eggplant Fatteh', ar_name: 'فتة باذنجان باللحم', price: 20 }
      ]
    },
    {
      id: 'combo_2',
      name: 'Ottoman Family Sofra',
      ar_name: 'سفرة العائلة العثمانية',
      price: 199,
      description: 'A table made for sharing\nChoose 4 mains, 2 fatteh, 3 sides, and 2 starters',
      ar_description: 'مائدة للمشاركة مع الأحباب\nتحتوي على ٤ أطباق رئيسية + ٢ فتّة + ٣ أطباق جانبية + و٢ مقبلات',
      serves: '4-5 people',
      ar_serves: '4 أشخاص',
      premium_items: [
        { name: 'Kibbeh Labanieh', ar_name: 'كبة بلبن', price: 3 },
        { name: 'Lalehan Mix (Labanieh)', ar_name: 'لبنية لاليهان', price: 3 },
        { name: 'Creamy Lemon Chicken', ar_name: 'دجاج بكريمة الليمون', price: 3 },
        { name: 'Izmir Kofta', ar_name: 'كفتة إزمير', price: 5 }
      ],
      fatteh_items: [
        { name: 'Yaprak Dolma Fatteh', ar_name: 'فتة ورق عنب', price: 0 },
        { name: 'Eggplant Fatteh', ar_name: 'فتة باذنجان', price: 0 },
        { name: 'Chicken Fatteh', ar_name: 'فتة دجاج بالسماق (مسخن)', price: 2 },
        { name: 'Pasha Eggplant Fatteh', ar_name: 'فتة باذنجان باللحم', price: 4 }
      ]
    },
    {
      id: 'combo_3',
      name: 'Lalehan Gathering',
      ar_name: 'جمعة لاليهان',
      price: 299,
      description: 'Our most generous sharing meal\nChoose 6 mains, 3 fatteh, 5 sides, and 3 starters',
      ar_description: 'أكبر وجبة مشاركة لدينا\nتحتوي على ٦ أطباق رئيسية + ٣ فتّة + ٥ أطباق جانبية + و٣ مقبلات',
      serves: '6-8 people',
      ar_serves: '6-8 أشخاص',
      premium_items: [
        { name: 'Kibbeh Labanieh', ar_name: 'كبة بلبن', price: 3 },
        { name: 'Lalehan Mix (Labanieh)', ar_name: 'لبنية لاليهان', price: 3 },
        { name: 'Creamy Lemon Chicken', ar_name: 'دجاج بكريمة الليمون', price: 3 },
        { name: 'Izmir Kofta', ar_name: 'كفتة إزمير', price: 5 }
      ],
      fatteh_items: [
        { name: 'Yaprak Dolma Fatteh', ar_name: 'فتة ورق عنب', price: 0 },
        { name: 'Eggplant Fatteh', ar_name: 'فتة باذنجان', price: 0 },
        { name: 'Chicken Fatteh', ar_name: 'فتة دجاج بالسماق (مسخن)', price: 2 },
        { name: 'Pasha Eggplant Fatteh', ar_name: 'فتة باذنجان باللحم', price: 4 }
      ]
    }
  ];

  let data = [], lang = 'ar';

  function q(sel, el=document){return el.querySelector(sel)}
  function qAll(sel, el=document){return Array.from(el.querySelectorAll(sel))}

  function parseCSVText(csvText){
    const parsed = Papa.parse(csvText, {header:true, skipEmptyLines:true});
    return parsed.data.map(row => ({
      id: row.id || Math.random().toString(36).slice(2,9),
      category: (row.category||'Uncategorized').trim(),
      ar_category: row.ar_category || (row.category||'Uncategorized').trim(),
      price: row.price || '',
      ar_name: row.ar_name || '',
      en_name: row.en_name || '',
      ar_desc: row.ar_desc || '',
      en_desc: row.en_desc || '',
      calories: row.calories || '',
      image_url: row.image_url || '',
      available: (String(row.available||'TRUE').toLowerCase() !== 'false')
    }));
  }

  function renderCombos(){
    const container = q('#combosContent');
    container.innerHTML = '';

    combosData.forEach(combo => {
      const card = document.createElement('div');
      card.className = 'combo-card';

      const header = document.createElement('div');
      header.className = 'combo-header';

      const nameGroup = document.createElement('div');
      nameGroup.className = 'combo-name-group';
      const name = document.createElement('h3');
      name.className = 'combo-name';
      name.textContent = lang === 'ar' ? combo.ar_name : combo.name;
      const serves = document.createElement('p');
      serves.className = 'combo-serves';
      serves.textContent = lang === 'ar' ? combo.ar_serves : combo.serves;
      nameGroup.appendChild(name);
      nameGroup.appendChild(serves);

      const basePrice = document.createElement('div');
      basePrice.className = 'combo-base-price';
      basePrice.innerHTML = combo.price + ' <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Saudi_Riyal_Symbol.svg/2560px-Saudi_Riyal_Symbol.svg.png" alt="SAR" class="sar-icon">';

      header.appendChild(basePrice);
      header.appendChild(nameGroup);

      const body = document.createElement('div');
      body.className = 'combo-body';

      const desc = document.createElement('p');
      desc.className = 'combo-description';
      desc.textContent = lang === 'ar' ? combo.ar_description : combo.description;

      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'choices-toggle';
      toggleBtn.innerHTML = lang === 'ar' ? '▶ عرض الخيارات' : '▶ View choices';

      const choicesContent = document.createElement('div');
      choicesContent.className = 'choices-content';

      // Premium Items
      const premiumTitle = document.createElement('p');
      premiumTitle.className = 'choice-group-title';
      premiumTitle.textContent = lang === 'ar' ? 'أطباق مميزة (إضافي)' : 'Premium Dishes (Extra)';
      choicesContent.appendChild(premiumTitle);

      combo.premium_items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'choice-item';
        const label = document.createElement('span');
        label.textContent = lang === 'ar' ? item.ar_name : item.name;
        const price = document.createElement('span');
        price.className = 'choice-price';
        price.innerHTML = '+' + item.price + ' <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Saudi_Riyal_Symbol.svg/2560px-Saudi_Riyal_Symbol.svg.png" alt="SAR" class="sar-icon">';
        row.appendChild(price);
        row.appendChild(label);
        choicesContent.appendChild(row);
      });

      // Fatteh Items
      const fattehTitle = document.createElement('p');
      fattehTitle.className = 'choice-group-title';
      fattehTitle.style.marginTop = '12px';
      fattehTitle.textContent = lang === 'ar' ? 'خيارات الفتة' : 'Fatteh Options';
      choicesContent.appendChild(fattehTitle);

      combo.fatteh_items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'choice-item';
        const label = document.createElement('span');
        label.textContent = lang === 'ar' ? item.ar_name : item.name;
        const price = document.createElement('span');
        price.className = 'choice-price';
        if(item.price === 0) {
          price.className += ' included';
          price.textContent = lang === 'ar' ? 'ضمن العرض' : 'Included';
        } else {
          price.innerHTML = '+' + item.price + ' <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Saudi_Riyal_Symbol.svg/2560px-Saudi_Riyal_Symbol.svg.png" alt="SAR" class="sar-icon">';
        }
        row.appendChild(price);
        row.appendChild(label);
        choicesContent.appendChild(row);
      });

      toggleBtn.onclick = () => {
        choicesContent.classList.toggle('active');
        toggleBtn.innerHTML = choicesContent.classList.contains('active')
          ? (lang === 'ar' ? '▼ إخفاء الخيارات' : '▼ Hide choices')
          : (lang === 'ar' ? '▶ عرض الخيارات' : '▶ View choices');
      };

      body.appendChild(desc);
      body.appendChild(toggleBtn);
      body.appendChild(choicesContent);

      card.appendChild(header);
      card.appendChild(body);
      container.appendChild(card);
    });
  }

  function renderMenu(){
    const container = q('#menuContent');
    container.innerHTML = '';
    const cats = [...new Set(data.map(i => i.category))];

    cats.forEach(cat => {
      const activeItems = data.filter(i => i.category === cat && i.available);
      if(activeItems.length === 0) return;

      const sectionTitle = document.createElement('h2');
      sectionTitle.textContent = (lang==='ar') ? (activeItems[0].ar_category || cat) : cat;
      sectionTitle.style.margin = '6px 0 6px 0';
      container.appendChild(sectionTitle);

      const grid = document.createElement('div');
      grid.className = 'category-section';

      activeItems.forEach(item => {
        const card = document.createElement('div'); card.className = 'card';
        const media = document.createElement('div'); media.className = 'media';
        if(item.image_url){
          const img = document.createElement('img'); img.src = item.image_url; img.alt = item.en_name || item.ar_name;
          media.appendChild(img);
        } else {
          media.textContent = (lang==='ar') ? item.ar_name || item.en_name : item.en_name || item.ar_name;
        }

        const body = document.createElement('div'); body.className = 'body';
        const titleRow = document.createElement('div'); titleRow.className = 'title-row';

        const title = document.createElement('div'); title.className = 'item-title';
        title.textContent = (lang==='ar') ? (item.ar_name || item.en_name) : (item.en_name || item.ar_name);

        const price = document.createElement('div'); price.className = 'price';
        if(item.price){
          price.innerHTML = item.price + ' <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Saudi_Riyal_Symbol.svg/2560px-Saudi_Riyal_Symbol.svg.png" alt="SAR" style="width:16px;height:16px;vertical-align:middle;margin-left:2px">';
        }

        // Price on Left, Title on Right
        titleRow.appendChild(price);
        titleRow.appendChild(title);

        const desc = document.createElement('div'); desc.className = 'item-desc';
        desc.textContent = (lang==='ar') ? (item.ar_desc || '') : (item.en_desc || '');

        body.appendChild(titleRow);
        body.appendChild(desc);

        if(item.calories){
          const cal = document.createElement('div');
          cal.style.marginTop = '6px';
          cal.style.fontSize = '12px';
          cal.style.color = '#7D3C1F';
          cal.textContent = lang === 'ar'
            ? item.calories + 'سعرة'
            : item.calories + ' kcal';
          body.appendChild(cal);
        }

        card.appendChild(media);
        card.appendChild(body);
        grid.appendChild(card);
      });

      container.appendChild(grid);
    });

    applyLanguageDirection();
  }

  function applyLanguageDirection(){
    const root = document.documentElement;
    const wrap = document.querySelector('.wrap');

    if(lang === 'ar'){
      wrap.classList.add('arabic');
      root.lang = 'ar';
      root.dir = 'rtl';
      q('#brandName').textContent = BRAND.nameAr;
      q('#brandTag').textContent = 'نكهات تُطهى بشغف';
      q('#combosTitle').textContent = 'الوجبات المميزة';
      q('#footerText').innerHTML = '🍴 مطعم تركي • 🛍️ Grab & Go';

      q('#contactPhone').innerHTML = '📞 <a href="tel:+966567097574">0567097574</a>';
      q('#contactHours').innerHTML = 'ساعات العمل:<br>الأحد – الخميس: 11 صباحاً – 1 صباحاً<br>الجمعة: 1 مساءً – 1 صباحاً';
      q('#contactDirections').innerHTML = '<a href="https://maps.app.goo.gl/SsmKjYCcSftRwVDd8" target="_blank">📍موقعنا</a>';
      q('#contactAddress').textContent = 'حازم بن عطاء، وادي مهزور، المدينة المنورة';

      q('#btn-en').classList.remove('active');
      q('#btn-ar').classList.add('active');
    } else {
      wrap.classList.remove('arabic');
      root.lang = 'en';
      root.dir = 'ltr';
      q('#brandName').textContent = BRAND.nameEn;
      q('#brandTag').textContent = '';
      q('#combosTitle').textContent = 'Special Combos';
      q('#footerText').innerHTML = '🍴 Turkish Restaurant • 🛍️ Grab & Go';

      q('#contactPhone').innerHTML = 'Phone: <a href="tel:+966567097574">056 709 7574</a>';
      q('#contactHours').innerHTML = 'Sun–Thu: 11:00 AM – 1:00 AM<br>Friday: 1:00 PM – 1:00 AM';
      q('#contactDirections').innerHTML = '<a href="https://maps.app.goo.gl/SsmKjYCcSftRwVDd8" target="_blank">📍Our location</a>';
      q('#contactAddress').textContent = 'Hazem Bin Atta, Wadi Mahzur, Madina';

      q('#btn-en').classList.add('active');
      q('#btn-ar').classList.remove('active');
    }

    renderCombos();
  }

  async function fetchSheet(){
    try{
      const res = await fetch(SHEET_CSV_URL);
      const text = await res.text();
      data = parseCSVText(text);
      renderMenu();
    }catch(err){
      console.error('Failed to load sheet', err);
      q('#menuContent').innerHTML = `
        <div style="padding:20px;background:#fff;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,0.06)">
          Failed to load the menu. Please check the Google Sheet publishing settings.
        </div>`;
    }
  }

  window.addEventListener('DOMContentLoaded', ()=>{
    q('#btn-en').addEventListener('click', ()=>{
      lang = 'en';
      renderMenu();
    });

    q('#btn-ar').addEventListener('click', ()=>{
      lang = 'ar';
      renderMenu();
    });

    if(SHEET_CSV_URL && !SHEET_CSV_URL.includes('REPLACE_WITH')) fetchSheet();
    else {
      q('#menuContent').innerHTML = '<div style="padding:20px;background:#fff;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,0.06)">⚠️ Please set the SHEET_CSV_URL to your published Google Sheet CSV URL.</div>';
    }

    renderCombos();
  });
  </script>
</body>
</html>
